[package]
name = "blacksouls-mmd-stage"
version = "0.1.0"
edition = "2021"
authors = ["MMD Engine Team"]
description = "BlackSouls Forge 1.20.1 NPC stage runtime"

[lib]
name = "mmd_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 本地依赖
mmd = { path = "deps/mmd-rs", default-features = false, features = ["arrayvec"] }
glam = { version = "0.29", features = ["std"] }
jni = "0.21"

# 外部依赖
bitflags = "2.6"
byteorder = "1.5"
encoding_rs = "0.8"
flate2 = "1.0"
thiserror = "2"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds"] }
once_cell = "1.19"
vek = "0.17"
rayon = "1.11.0"
gltf = { version = "1.4", features = ["names", "extras", "extensions", "KHR_materials_unlit"] }
serde_json = "1.0"
bytemuck = { version = "1.16", features = ["derive"], optional = true }

[features]
default = []

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
