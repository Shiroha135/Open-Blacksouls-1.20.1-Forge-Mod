# Minecraft 1.20.1 Forge Mod 配置文件
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Shiroha135/Shiroha135.github.io"
logoFile="logo.png"
authors="${mod_authors}"
description='''
感谢寿司勇者创作的BlackSouls系列，以及所有支持本模组的人。
这是一个基于BlackSouls系列制作的模组，加入了独特的技能系统、蓝量机制以及相关特色道具。
'''

[[mods]]
modId="mmdskin"
version="1.0.5-1.20.1-blacksouls"
displayName="MMD Skin for BLACKSOULS"
authors="shiroha233, kjkjkAIStudio, asuka-mio, Gengorou-C"
description='''
将 MMD 模型渲染、动作、物理和舞台功能直接集成到 BLACKSOULS 主模组中。
'''

# ====================================================
# 基础前置依赖（必选） (Forge & Minecraft)
# ====================================================
[[dependencies.blacksouls]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.blacksouls]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.blacksouls]]
modId="modernui"
mandatory=true
versionRange="[3.12.0.1,4.0.0)"
ordering="BEFORE"
side="CLIENT"

[[dependencies.blacksouls]]
modId="curios"
mandatory=true
versionRange="[5.14.1,6.0.0)"
ordering="BEFORE"
side="BOTH"

[[dependencies.mmdskin]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.mmdskin]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

