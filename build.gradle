def platformDependencyJars = [
        modernUi: file('F:/MC/Hatsuyuki 3.0Pro++/.minecraft/versions/秒杀/mods/[现代化 UI] ModernUI-Forge-1.20.1-3.12.0.1-universal.jar'),
        curios  : file('F:/MC/Hatsuyuki 3.0Pro++/.minecraft/versions/秒杀/mods/curios-forge-5.14.1+1.20.1.jar')
]
def completeDependencyJars = mapDependencyJars + platformDependencyJars

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                "mmdskin" {
                    source sourceSets.main
                }
            }
        }



        client {
            args '-mixin.config=mixins.blacksouls.json'
            args '-mixin.config=mmdskin-forge.mixins.json'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        ['A', 'B', 'C', 'D'].eachWithIndex { suffix, index ->
            create("client${suffix}") {
                client true
                parent runs.client
                workingDirectory project.file("run/client-${suffix.toLowerCase()}")
                args '--username', "PartyTester${index + 1}"
                args '-mixin.config=mixins.blacksouls.json'
                args '-mixin.config=mmdskin-forge.mixins.json'
                jvmArgs '-Xms2G', '-Xmx8G'
                property 'forge.enabledGameTestNamespaces', mod_id
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            args '-mixin.config=mixins.blacksouls.json'
            args '-mixin.config=mmdskin-forge.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

minecraft.runs.all {
    lazyToken('minecraft_classpath') {
        configurations.library.resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    flatDir {
        dirs new File(mapCompatProjectDir, 'build/libs'),
                new File(musicPackProjectDir, 'build/libs'),
                mapDependencyDir,
                file('F:/BaiduNetdiskDownload/MC/Blacksouls2_1.20.1_server_test/mods')
    }

    maven {
        name = 'IzzelAliz'
        url = 'https://maven.izzel.io/releases/'
        content {
            includeGroup 'icyllis.modernui'
        }
    }

    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/releases/'
        content {
            includeGroup 'me.clip'
        }
    }
}

configurations {
    mmdEmbedded
    library {
        exclude group: "com.google.code.findbugs"
        exclude group: "org.jetbrains"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    runtimeOnly fg.deobf("maven.modrinth:oculus:1.20.1-1.7.0")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")

    runtimeOnly fg.deobf("maven.modrinth:embeddium:0.3.31+mc1.20.1")

    implementation fg.deobf("icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1")
    library("icyllis.modernui:ModernUI-Core:3.12.0") { transitive = false }
    library("icyllis.modernui:ModernUI-Markflow:3.12.0") { transitive = false }
    library "com.ibm.icu:icu4j:76.1"
    library "it.unimi.dsi:fastutil:8.5.15"
    library("org.commonmark:commonmark:0.25.0") { transitive = false }

    implementation 'javazoom:jlayer:1.0.1'
    mmdEmbedded 'javazoom:jlayer:1.0.1'

    implementation "io.github.humbleui:skija-shared:0.143.17"
    implementation "io.github.humbleui:skija-windows-x64:0.143.17"
    implementation "io.github.humbleui:types:0.2.0"
    minecraftLibrary "io.github.humbleui:skija-shared:0.143.17"
    minecraftLibrary "io.github.humbleui:skija-windows-x64:0.143.17"
    minecraftLibrary "io.github.humbleui:types:0.2.0"
    jarJar(group: "io.github.humbleui", name: "skija-shared", version: "[0.143.17,0.143.18)") {
        jarJar.pin(it, "0.143.17")
    }
    jarJar(group: "io.github.humbleui", name: "skija-windows-x64", version: "[0.143.17,0.143.18)") {
        jarJar.pin(it, "0.143.17")
    }
    jarJar(group: "io.github.humbleui", name: "types", version: "[0.2.0,0.3.0)") {
        jarJar.pin(it, "0.2.0")
    }

    mapDependencyJars.values().findAll { it.isFile() }.each { dependencyJar ->
        def artifactName = dependencyJar.name.substring(0, dependencyJar.name.length() - '.jar'.length())
        runtimeOnly fg.deobf("hakoniwa.local:${artifactName}:1")
    }

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    exclude '**/*.mca'
}

tasks.register('copyMaps', Copy) {
    from sourceSets.main.resources
    include '**/*.mca'
    into "$buildDir/resources/main"
}
tasks.named('processResources').configure {
    finalizedBy 'copyMaps'
}
tasks.withType(JavaExec).configureEach {
    dependsOn 'copyMaps'
    doFirst {
        File minecraftClasspath = file("$buildDir/classpath/${name}_minecraftClasspath.txt")
        if (minecraftClasspath.isFile()) {
            List<String> entries = minecraftClasspath.readLines('UTF-8')
            minecraftClasspath.setText(new LinkedHashSet<>(entries).join(System.lineSeparator()), 'UTF-8')
        }
    }
}

tasks.named('jar', Jar).configure {
    dependsOn 'copyMaps'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.mmdEmbedded.collect { dependency -> zipTree(dependency) }
    }

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
    exclude 'module-info.class'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mixins.blacksouls.json,mmdskin-forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

reobf {
    jarJar {}
}

tasks.named('jarJar').configure {
    dependsOn 'copyMaps'
}

def completeDistributionName = "BlackSouls-II-${mod_version}-complete"
def completeDistributionDir = layout.buildDirectory.dir("distributions/${completeDistributionName}")
def completeDistributionModsDir = completeDistributionDir.map { it.dir('mods') }

tasks.register('verifyMapDependencies') {
    group = 'verification'
    description = 'Verifies every Hakoniwa map and music dependency JAR used by the complete distribution.'

    inputs.files(completeDependencyJars.values())

    doLast {
        def missing = completeDependencyJars.findAll { !it.value.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('Missing Hakoniwa dependency JARs:\n' + missing.collect { "- ${it.key}: ${it.value}" }.join('\n'))
        }

        def duplicateNames = completeDependencyJars.values().groupBy { it.name }.findAll { it.value.size() > 1 }
        if (!duplicateNames.isEmpty()) {
            throw new GradleException('Duplicate Hakoniwa dependency filenames: ' + duplicateNames.keySet().join(', '))
        }
    }
}

tasks.register('prepareCompleteDistribution', Sync) {
    group = 'distribution'
    description = 'Builds a ready-to-install mods folder with all Hakoniwa map and music dependencies.'
    dependsOn 'reobfJarJar', 'verifyMapDependencies'

    into completeDistributionDir
    into('mods') {
        from(layout.buildDirectory.file("libs/${mod_id}-${mod_version}-all.jar"))
        from(completeDependencyJars.values())
    }

    doLast {
        File modsDir = completeDistributionModsDir.get().asFile
        File readme = new File(completeDistributionDir.get().asFile, '安装说明.txt')
        File checksums = new File(completeDistributionDir.get().asFile, 'SHA256SUMS.txt')
        def jars = modsDir.listFiles({ file -> file.isFile() && file.name.endsWith('.jar') } as FileFilter).sort { it.name }

        readme.setText("""BLACKSOULS II ${mod_version} 完整发行包

适用版本：Minecraft 1.20.1 / Forge ${forge_version}
安装方法：将 mods 文件夹内的全部 JAR 一起放入游戏的 mods 文件夹，不要只复制主 Mod。
本包包含箱庭地图兼容方块、地图仍使用的外部方块 Mod、Curios、Modern UI，以及 BLACKSOULS II 音乐包。
Natural Decor 等已由地图兼容包接管的命名空间没有重复打包，以避免方块重复注册。
""", 'UTF-8')

        checksums.setText(jars.collect { jarFile ->
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes).encodeHex().toString()
            "${digest}  ${jarFile.name}"
        }.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('completeDistributionZip', Zip) {
    group = 'distribution'
    description = 'Creates the complete BLACKSOULS II distribution ZIP.'
    dependsOn 'prepareCompleteDistribution'
    from completeDistributionDir
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "${completeDistributionName}.zip"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
