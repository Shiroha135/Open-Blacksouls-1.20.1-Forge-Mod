plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "mixins.blacksouls.refmap.json"
    config "mixins.blacksouls.json"
    config "mmdskin-forge.mixins.json"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

jarJar.enable()

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                "mmdskin" {
                    source sourceSets.main
                }
            }
        }



        client {
            args '-mixin.config=mixins.blacksouls.json'
            args '-mixin.config=mmdskin-forge.mixins.json'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        ['A', 'B', 'C', 'D'].eachWithIndex { suffix, index ->
            create("client${suffix}") {
                client true
                parent runs.client
                workingDirectory project.file("run/client-${suffix.toLowerCase()}")
                args '--username', "PartyTester${index + 1}"
                args '-mixin.config=mixins.blacksouls.json'
                args '-mixin.config=mmdskin-forge.mixins.json'
                jvmArgs '-Xms2G', '-Xmx8G'
                property 'forge.enabledGameTestNamespaces', mod_id
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            args '-mixin.config=mixins.blacksouls.json'
            args '-mixin.config=mmdskin-forge.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

minecraft.runs.all {
    lazyToken('minecraft_classpath') {
        configurations.library.resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven {
        name = 'IzzelAliz'
        url = 'https://maven.izzel.io/releases/'
        content {
            includeGroup 'icyllis.modernui'
        }
    }

    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/releases/'
        content {
            includeGroup 'me.clip'
        }
    }
}

configurations {
    mmdEmbedded
    library {
        exclude group: "com.google.code.findbugs"
        exclude group: "org.jetbrains"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    runtimeOnly fg.deobf("maven.modrinth:oculus:1.20.1-1.7.0")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")

    runtimeOnly fg.deobf("maven.modrinth:embeddium:0.3.31+mc1.20.1")

    implementation fg.deobf("icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1")
    library("icyllis.modernui:ModernUI-Core:3.12.0") { transitive = false }
    library("icyllis.modernui:ModernUI-Markflow:3.12.0") { transitive = false }
    library "com.ibm.icu:icu4j:76.1"
    library "it.unimi.dsi:fastutil:8.5.15"
    library("org.commonmark:commonmark:0.25.0") { transitive = false }

    implementation 'javazoom:jlayer:1.0.1'
    mmdEmbedded 'javazoom:jlayer:1.0.1'

    implementation "io.github.humbleui:skija-shared:0.143.17"
    implementation "io.github.humbleui:skija-windows-x64:0.143.17"
    implementation "io.github.humbleui:types:0.2.0"
    minecraftLibrary "io.github.humbleui:skija-shared:0.143.17"
    minecraftLibrary "io.github.humbleui:skija-windows-x64:0.143.17"
    minecraftLibrary "io.github.humbleui:types:0.2.0"
    jarJar(group: "io.github.humbleui", name: "skija-shared", version: "[0.143.17,0.143.18)") {
        jarJar.pin(it, "0.143.17")
    }
    jarJar(group: "io.github.humbleui", name: "skija-windows-x64", version: "[0.143.17,0.143.18)") {
        jarJar.pin(it, "0.143.17")
    }
    jarJar(group: "io.github.humbleui", name: "types", version: "[0.2.0,0.3.0)") {
        jarJar.pin(it, "0.2.0")
    }

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    exclude '**/*.mca'
}

tasks.register('copyMaps', Copy) {
    from sourceSets.main.resources
    include '**/*.mca'
    into "$buildDir/resources/main"
}
tasks.named('processResources').configure {
    finalizedBy 'copyMaps'
}
tasks.withType(JavaExec).configureEach {
    dependsOn 'copyMaps'
    doFirst {
        File minecraftClasspath = file("$buildDir/classpath/${name}_minecraftClasspath.txt")
        if (minecraftClasspath.isFile()) {
            List<String> entries = minecraftClasspath.readLines('UTF-8')
            minecraftClasspath.setText(new LinkedHashSet<>(entries).join(System.lineSeparator()), 'UTF-8')
        }
    }
}

tasks.named('jar', Jar).configure {
    dependsOn 'copyMaps'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.mmdEmbedded.collect { dependency -> zipTree(dependency) }
    }

    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
    exclude 'module-info.class'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mixins.blacksouls.json,mmdskin-forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

reobf {
    jarJar {}
}

tasks.named('jarJar').configure {
    dependsOn 'copyMaps'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
