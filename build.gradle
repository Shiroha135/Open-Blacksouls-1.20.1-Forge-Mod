plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "mixins.blacksouls.refmap.json"
    config "mixins.blacksouls.json"
    config "mmdskin-forge.mixins.json"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

jarJar.enable()

def mapCompatProjectDir = file('F:/BaiduNetdiskDownload/MC/Blacksouls2MapCompat')
def musicPackProjectDir = file('F:/BaiduNetdiskDownload/MC/Blacksouls2MusicPack')
